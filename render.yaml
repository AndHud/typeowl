services:
  - type: web
    name: typeowl-web
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python web_server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 10000
    healthCheckPath: /
    autoDeploy: true